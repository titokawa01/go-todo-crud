<h2>MySQLに接続する</h2>

<p>
Goアプリは database/sql パッケージを使ってデータベースに接続します。
</p>

<pre><code class="language-go">
db, err = sql.Open("mysql",
"root:9999@unix(/tmp/mysql.sock)/mermaid")
</code></pre>

</div>

<div class="section">

<h2>DB接続確認</h2>

<pre><code class="language-go">
err = db.Ping()
</code></pre>

<p>
Pingはデータベースに接続できるか確認する処理です。
</p>

</div>

<div class="section">

<h2>演習</h2>

<div class="exercise">

<pre><code class="language-go">
db, err := sql.Open("mysql", "????")
</code></pre>

<p>
